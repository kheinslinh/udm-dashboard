name: Weekly report

on:
  schedule:
    - cron: "0 1 * * 5" # Friday 09:00 Malaysia time (UTC+8); GitHub may start it a few minutes late
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the report in the log instead of posting to Discord"
        type: boolean
        default: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and post
        env:
          REWORK_API_BASE: ${{ secrets.REWORK_API_BASE }}
          REWORK_API_TOKEN: ${{ secrets.REWORK_API_TOKEN }}
          REWORK_PATH_SERVICES: ${{ secrets.REWORK_PATH_SERVICES }}
          REWORK_PATH_GROUPS: ${{ secrets.REWORK_PATH_GROUPS }}
          REWORK_PATH_RESOURCE_ITEMS: ${{ secrets.REWORK_PATH_RESOURCE_ITEMS }}
          REWORK_PATH_WORK_ITEMS: ${{ secrets.REWORK_PATH_WORK_ITEMS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python -m udm_report ${{ inputs.dry_run && '--dry-run' || '' }}

  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
