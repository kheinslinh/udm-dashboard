name: Refresh dashboard data

on:
  schedule:
    - cron: "0 23 * * *" # 07:00 Malaysia time (UTC+8) every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export from Rework
        env:
          REWORK_API_BASE: ${{ secrets.REWORK_API_BASE }}
          REWORK_API_TOKEN: ${{ secrets.REWORK_API_TOKEN }}
          REWORK_PATH_SERVICES: ${{ secrets.REWORK_PATH_SERVICES }}
          REWORK_PATH_GROUPS: ${{ secrets.REWORK_PATH_GROUPS }}
          REWORK_PATH_RESOURCE_ITEMS: ${{ secrets.REWORK_PATH_RESOURCE_ITEMS }}
          REWORK_PATH_WORK_ITEMS: ${{ secrets.REWORK_PATH_WORK_ITEMS }}
        run: python -m udm_report.export --out site/data
      - name: Commit if changed
        run: |
          git add site/data
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git -c user.name="udm-report bot" -c user.email="actions@github.com" commit -m "Refresh dashboard data"
          git push
