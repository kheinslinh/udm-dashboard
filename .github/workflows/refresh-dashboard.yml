name: Refresh dashboard data

on:
  workflow_dispatch:
    inputs:
      ping_only:
        description: "Only check the Rework API connection (no export, no commit)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Rework API connection
        if: inputs.ping_only
        env:
          REWORK_API_BASE: ${{ secrets.REWORK_API_BASE }}
          REWORK_API_TOKEN: ${{ secrets.REWORK_API_TOKEN }}
          REWORK_API_KEY: ${{ secrets.REWORK_API_KEY }}
        run: python -m udm_report --ping
      - name: Export from Rework
        if: ${{ !inputs.ping_only }}
        env:
          REWORK_API_BASE: ${{ secrets.REWORK_API_BASE }}
          REWORK_API_TOKEN: ${{ secrets.REWORK_API_TOKEN }}
          REWORK_API_KEY: ${{ secrets.REWORK_API_KEY }}
          REWORK_PATH_SERVICES: ${{ secrets.REWORK_PATH_SERVICES }}
          REWORK_PATH_GROUPS: ${{ secrets.REWORK_PATH_GROUPS }}
          REWORK_PATH_RESOURCE_ITEMS: ${{ secrets.REWORK_PATH_RESOURCE_ITEMS }}
          REWORK_PATH_WORK_ITEMS: ${{ secrets.REWORK_PATH_WORK_ITEMS }}
        run: python -m udm_report.export --out site/data
      - name: Commit if changed
        if: ${{ !inputs.ping_only }}
        run: |
          git add site/data
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git -c user.name="udm-report bot" -c user.email="actions@github.com" commit -m "Refresh dashboard data"
          git push
